; Build the firmware locally, then upload the .bin/.elf to Wokwi.
;   pio run
;   pio run --target upload        # (Wokwi: Tools > Firmware Upload, or the Wokwi VS Code extension)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -D API_BASE_URL=\"https://your-tunnel.example.com\"
    -D WIFI_CHANNEL=6
